# 双层/梯度纳米孪晶铜建模统一配置文件
# 修改参数后直接运行：python dual_gradient_cu_builder.py
# 长度单位：盒子与层厚为 nm；晶格常数为 Å。

[paths]
# Atomsk 可执行文件完整路径。若 Atomsk 已加入系统 PATH，可写 "auto"。
atomsk = "auto"
# 输出目录；相对路径相对本配置文件所在目录。
output_root = "output"

[build]
# 面内正方形盒子的边长（nm）。增大会显著增加原子数与内存占用。
box_xy_nm = 18.0
# FCC 铜晶格常数（Å）。当前采用 3.633 Å。
a0_angstrom = 3.633
# 元素符号。目前脚本按单元素 FCC 结构设计。
element = "Cu"
# 多晶种子节点的打包系数；通常保持 1.0。
packing_scale = 1.0
# 多晶种子在 x 方向的无量纲偏移系数。
shiftx = 0.25
# 多晶种子在 y 方向的无量纲偏移系数。
shifty = 0.35
# 孪晶种子在 x 方向的面内重复数。
twin_nx = 8
# 孪晶种子在 y 方向的面内重复数。
twin_ny = 8

[layer_thickness_nm]
# AB 两层模型中 A 层厚度（nm）。
AB_A = 24.0
# AB 两层模型中 B 层厚度（nm）。
AB_B = 20.0
# ABAB 四层模型中每个 A 层厚度（nm）。
ABAB_A = 12.0
# ABAB 四层模型中每个 B 层厚度（nm）。
ABAB_B = 10.0
# 纯单相/均匀参照模型总厚度（nm）。
PURE = 44.0

[twin_n111]
# T 编号对应单个孪晶周期包含的 {111} 原子层数；实际孪晶间距由编号、a0 自动换算。
T4 = 4
T6 = 6
T10 = 10
T15 = 15
T20 = 20
T24 = 24
T30 = 30

# 晶粒模板：nx × ny 为面内 Voronoi 晶粒排布；label 用于输出元数据说明。
[grain_templates.single]
# single 模板的 x 方向晶粒数。
nx = 1
# single 模板的 y 方向晶粒数。
ny = 1
# 模板说明，可按需要改为中文。
label = 'single crystal'

[grain_templates.G2x2]
# G2x2 模板的 x 方向晶粒数。
nx = 2
# G2x2 模板的 y 方向晶粒数。
ny = 2
# 模板说明，可按需要改为中文。
label = '4 grains'

[grain_templates.G3x2]
# G3x2 模板的 x 方向晶粒数。
nx = 3
# G3x2 模板的 y 方向晶粒数。
ny = 2
# 模板说明，可按需要改为中文。
label = '6 grains'

[grain_templates.G4x2]
# G4x2 模板的 x 方向晶粒数。
nx = 4
# G4x2 模板的 y 方向晶粒数。
ny = 2
# 模板说明，可按需要改为中文。
label = '8 grains'

[grain_templates.G4x3]
# G4x3 模板的 x 方向晶粒数。
nx = 4
# G4x3 模板的 y 方向晶粒数。
ny = 3
# 模板说明，可按需要改为中文。
label = '12 grains'

[grain_templates.G5x3]
# G5x3 模板的 x 方向晶粒数。
nx = 5
# G5x3 模板的 y 方向晶粒数。
ny = 3
# 模板说明，可按需要改为中文。
label = '15 grains'

# 计划模型清单：每一段为一个待批量构建的双层梯度模型。
# grain_a/grain_b 必须是上面的晶粒模板名；twin_a/twin_b 必须是上面的 T 编号。
[[plan_models]]
# REF：模型名，将成为输出目录名。
name = 'REF'
family = 'REF'
phase = 'P0'
grain_a = 'G3x2'
grain_b = 'G3x2'
twin_a = 'T15'
twin_b = 'T15'

[[plan_models]]
# TTG-1：模型名，将成为输出目录名。
name = 'TTG-1'
