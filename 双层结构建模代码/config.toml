[run]
# 本次默认执行模式："plan" 批量构建、"block" 单层块、"merge" 自定义叠层。
command = "plan"
# plan 模式构建阶段："all"、"P0"、"P1" 或 "P2"。
plan_phase = "P0"
# 是否同时构建纯相参照模型。
include_pure = true
# family 筛选；空数组表示不筛选。可写 ["TTG", "DG"]。
families = []
# 模型名筛选；空数组表示不筛选。可写 ["REF", "TTG-2"]。
models = []
# 叠层变体筛选；空数组表示不筛选。可写 ["AB"] 或 ["ABAB"]。
variants = []
# true 时即使输出已存在也重新生成；首次运行或改参数后建议 true。
force = false

# 以下参数只在 command = "block" 时使用。
# 单层块的晶粒模板名。
block_grain = "G3x2"
# 单层块的孪晶代码；无孪晶单晶粒块写 "none"。
block_twin = "T15"
# 单层块厚度（nm）。
block_thickness_nm = 24.0

# 以下参数只在 command = "merge" 时使用。
# 自定义叠层模型名称。
merge_name = "custom_AB"
# 自定义模型所属系列名称。
merge_family = "CUSTOM"
# 自定义模型阶段标签。
merge_phase = "custom"
# 自定义叠层列表，格式为“晶粒模板:孪晶代码:厚度_nm”；顺序即从下到上的叠层顺序。
merge_layers = ["G3x2:T10:24", "G3x2:T20:20"]
